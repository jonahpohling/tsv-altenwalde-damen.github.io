<style>
/* Layout: rote Trikot-Kopfzeile mit Streifen, darunter Karten im 12er-Raster. Vereinsfarben Rot-Weiß, Rot nur für Marke und Hervorhebung. */
:root{
  --bg:#f6f3f3; --surface:#ffffff; --ink:#1d1416; --muted:#6d6266; --line:#ebe3e4;
  --red:#c8102e; --red-deep:#8e0c22; --red-soft:#fbe7ea; --on-red:#ffffff;
  --win:#2f9e44; --draw:#e0a100; --loss:#4b4f58; --row-hl:#fbe7ea;
  --shadow:0 1px 2px rgba(60,10,20,.06),0 6px 20px rgba(60,10,20,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141012; --surface:#1e181a; --ink:#f3ecee; --muted:#a8999d; --line:#33292c;
    --red:#e5243f; --red-deep:#8e0c22; --red-soft:#3a1a20; --on-red:#ffffff;
    --win:#51cf66; --draw:#f2b824; --loss:#8a909c; --row-hl:#2e1a1f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1e181a; --ink:#f3ecee; --muted:#a8999d; --line:#33292c;
  --red:#e5243f; --red-deep:#8e0c22; --red-soft:#3a1a20; --on-red:#ffffff;
  --win:#51cf66; --draw:#f2b824; --loss:#8a909c; --row-hl:#2e1a1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
a{color:var(--red);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;text-transform:uppercase;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* Kopfzeile */
header{background:
  repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.07) 46px 58px),
  linear-gradient(135deg,var(--red) 0%,var(--red-deep) 100%);color:var(--on-red)}
.head-in{max-width:1180px;margin:0 auto;padding:22px 16px 0;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;box-shadow:0 0 0 3px rgba(255,255,255,.35);flex:none}
.brand h1{font-size:2.1rem;line-height:.95;font-style:italic;font-weight:800}
.brand .sub{font-size:.95rem;opacity:.85;margin-top:3px}
.title-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.stand{font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stand .dot{width:8px;height:8px;border-radius:50%;background:#7dffa0;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(125,255,160,.25)}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.85rem}
.hbtn:hover{background:rgba(255,255,255,.25)}
nav{display:flex;gap:2px;overflow-x:auto;margin:0 -4px}
nav a{color:#fff;text-decoration:none;padding:11px 14px;font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75;white-space:nowrap;border-radius:8px 8px 0 0}
nav a[aria-current="page"]{opacity:1;background:var(--bg);color:var(--red)}
nav a:hover{opacity:1}

main{max-width:1180px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
.card{background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:5px;height:1em;background:var(--red);border-radius:2px;transform:skewX(-12deg)}
.card h3{font-size:1.1rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hint{font-size:.85rem;color:var(--muted);line-height:1.4}

/* Kennzahlen */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:.95}
.kpi .l{color:var(--muted);font-size:.88rem}
.kpi.red .v{color:var(--red)}

/* Nächstes Spiel */
.match{position:relative;overflow:hidden;background:linear-gradient(135deg,#231a1c,#3a1820);color:#fff}
.match::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(200,16,46,.35)}
.match .muted{color:rgba(255,255,255,.7)}
.match a{color:#fff}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);font-weight:600}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;position:relative;z-index:1}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side .ini{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
.side.us .ini{background:#fff;color:var(--red);border-color:#fff}
.side .nm{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.05;text-transform:uppercase}
.vsmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsmid .when{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.vsmid .date{font-weight:600}
.count{background:var(--red);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.matchfoot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.15);padding-top:12px;position:relative;z-index:1;font-size:.95rem}

/* Tabellen */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tbody tr:last-child td{border-bottom:none}
tr.hl td{background:var(--row-hl);font-weight:700}
tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--red)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--bg)}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:700;font-size:.85rem}
.rank.top{background:var(--red);color:#fff}

.chip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:.72rem;font-weight:800;color:#fff}
.chip.S{background:var(--win)}.chip.U{background:var(--draw)}.chip.N{background:var(--loss)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pill.home{background:var(--red-soft);color:var(--red);border-color:transparent}
.score{font-family:var(--display);font-weight:800;font-size:1.35rem;padding:2px 10px;border-radius:8px;min-width:72px;text-align:center;display:inline-block}
.score.S{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win)}
.score.N{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--ink)}
.score.U{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--ink)}
.score.open{color:var(--muted);font-weight:600;font-size:1rem}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--red);border-radius:4px}
.share{display:flex;align-items:center;gap:8px}
.share .bar{flex:1}
.share span{width:40px;text-align:right}
.barrow{display:grid;grid-template-columns:minmax(120px,1.3fr) 3fr 48px;gap:10px;align-items:center;font-size:.93rem}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.cal{border-radius:8px;overflow:hidden;text-align:center;border:1px solid var(--line);line-height:1.1}
.cal b{display:block;background:var(--red);color:#fff;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal span{display:block;font-family:var(--display);font-weight:800;font-size:1.25rem;padding:2px 0 0}
.cal small{display:block;font-size:.72rem;color:var(--muted);padding-bottom:3px}
.li .t{display:flex;flex-direction:column;gap:2px}
.li .t .o{font-weight:600}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pod{border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.pod.first{background:var(--red);color:#fff}
.pod .pl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75;font-weight:700}
.pod .pn{font-weight:700;line-height:1.2}
.pod .pv{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.pod .ps{font-size:.8rem;opacity:.8}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--red)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input[type=date],input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
input[type=number]{width:64px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.savebar{position:sticky;bottom:14px;align-self:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:5}
.savebar .btn{border-color:transparent;border-radius:999px}
.note{border-left:4px solid var(--red);padding:8px 12px;background:var(--red-soft);border-radius:0 8px 8px 0;font-size:.9rem}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.empty{padding:22px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg text{fill:var(--muted);font-family:var(--body)}
.nr{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;margin-right:7px;border-radius:5px;background:var(--ink);color:var(--surface);font-family:var(--display);font-weight:800;font-size:.9rem;vertical-align:1px}
.match .nr{background:#fff;color:var(--red)}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px 14px}
.fi{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:1rem}
.ft{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:1rem;margin-bottom:2px}
.fx{font-size:.93rem;line-height:1.4}
.watch{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.95rem;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px}
.watch .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);font-weight:700;width:100%}
footer{max-width:1180px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:.85rem}
@media (max-width:520px){.brand h1{font-size:1.6rem}.crest{width:46px;height:46px;font-size:1rem}.side .nm{font-size:1.05rem}.vsmid .when{font-size:1.9rem}.side .ini{width:48px;height:48px;font-size:1.1rem}.podium{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function players(){

  if(bestD[0].c===c)F.push(["Beste Abwehr der Liga","Nur Ø "+de(bestD[0].v)+" Gegentore pro Spiel."]);
  else if(bestD[bestD.length-1].c===c)F.push(["Schwächste Abwehr der Liga","Ø "+de(r.tk/r.sp)+" Gegentore pro Spiel."]);
  if(bestO[0].c===c)F.push(["Bester Angriff der Liga","Ø "+de(r.tg/r.sp)+" Tore pro Spiel."]);
  var hm=[],aw=[];teamGames(c).forEach(function(m){if(!m.played)return;(m.h===c?hm:aw).push(m.h===c?m.hg:m.ag);});
  function avg(a){return a.reduce(function(s,x){return s+x;},0)/a.length;}
  if(hm.length&&aw.length&&Math.abs(avg(hm)-avg(aw))>=4)F.push([avg(hm)>avg(aw)?"Heimstark":"Auswärts gefährlicher",'Zu Hause Ø '+de(avg(hm))+' Tore, auswärts Ø '+de(avg(aw))+'.']);
  return F.slice(0,4);
}

  max=Math.ceil(max/10)*10;var bw=(W-pl-10)/n,y=function(v){return pt+(H-pt-pb)*(1-v/max);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Tore und Gegentore pro Spiel">';
  for(var v=0;v<=max;v+=10)s+='<line x1="'+pl+'" x2="'+(W-10)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11">'+v+'</text>';
  played.forEach(function(m,i){var f=m.h===c?m.hg:m.ag,a=m.h===c?m.ag:m.hg,w=Math.min(bw*.3,34),x=pl+i*bw+bw/2-w-1;
    s+='<rect x="'+x+'" y="'+y(f)+'" width="'+w+'" height="'+(y(0)-y(f))+'" rx="3" fill="var(--red)"><title>'+f+' Tore</title></rect>';
    s+='<rect x="'+(x+w+2)+'" y="'+y(a)+'" width="'+w+'" height="'+(y(0)-y(a))+'" rx="3" fill="var(--loss)" opacity=".45"><title>'+a+' Gegentore</title></rect>';
    s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-20)+'" text-anchor="middle" font-size="11">'+short(m.date)+'</text><text x="'+(pl+i*bw+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="10">'+esc(INI[opp(m,c)])+'</text>';});
  return s+'</svg><div class="legend"><span style="--c:var(--red)">Tore</span><span style="--c:var(--loss)">Gegentore</span><span>Kürzel unten = Gegner</span></div>';
}

/* ---------- Spielplan ---------- */
function viewSpielplan(){
  var list=matches().filter(function(m){return ui.planAll||m.h==="ALT"||m.g==="ALT";});
  var h='<div class="grid"><section class="card c12"><div class="toolbar" style="justify-content:space-between"><h2>Spielplan</h2><div class="seg" role="group" aria-label="Filter"><button data-act="planOwn" aria-pressed="'+!ui.planAll+'">Unsere Spiele</button><button data-act="planAll" aria-pressed="'+ui.planAll+'">Ganze Liga</button></div></div>'+
    (editing?'<div class="note">Ergebnisse kommen jeden Abend automatisch aus nuLiga. Wer nicht warten will, trägt hier ein Ergebnis vorab ein. Sobald nuLiga es hat, gilt das offizielle.</div>':'')+
    '<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Zeit</th><th>Heim</th><th>Gast</th><th class="c">Ergebnis</th><th>Halle</th></tr></thead><tbody>'+
    list.map(function(m){var mine=m.h==="ALT"||m.g==="ALT",oc=mine?outcome(m,"ALT"):null,res;
      if(editing&&!m.league)res='<input type="number" min="0" id="r'+m.nr+'h" data-m="'+m.nr+'" data-side="0" value="'+(m.hg==null?"":m.hg)+'" aria-label="Tore Heim"> : <input type="number" min="0" id="r'+m.nr+'g" data-m="'+m.nr+'" data-side="1" value="'+(m.ag==null?"":m.ag)+'" aria-label="Tore Gast">';
      else res=m.played?'<span class="score num '+(oc||"")+'" style="font-size:1.05rem">'+m.hg+':'+m.ag+'</span>'+(m.own?'<sup title="vorab selbst eingetragen">*</sup>':''):'<span class="muted">–</span>';
      return '<tr class="'+(mine&&ui.planAll?"hl":"")+'"><td class="num">'+fmtDate(m.date,true)+'</td><td class="num">'+m.time+'</td><td>'+esc(TEAMS[m.h])+'</td><td>'+esc(TEAMS[m.g])+'</td><td class="c num">'+res+'</td><td>'+
        (mapsLink(m.hall)?'<a href="'+mapsLink(m.hall)+'">'+esc(hallName(m.hall))+'</a>':esc(hallName(m.hall)))+'</td></tr>';}).join("")+
    '</tbody></table></div><div class="hint">Hallenname anklicken öffnet die Anfahrt. Verlegungen übernimmt die Seite beim nächsten automatischen Abgleich mit nuLiga.</div></section></div>';
  return h;
}

/* ---------- Rendern ---------- */
var VIEWS={start:viewStart,team:viewTeam,gegner:viewGegner,tabelle:viewTabelle,spielplan:viewSpielplan};
function route(){var k=(location.hash||"#start").slice(1);return VIEWS[k]?k:"start";}
function render(){
  var k=route();
  document.querySelectorAll("#nav a").forEach(function(a){a.setAttribute("aria-current",a.getAttribute("href")==="#"+k?"page":"false");});
  var u=LEAGUE.updated||"";
  document.getElementById("stand").innerHTML='<span title="Ligadaten werden jeden Abend automatisch aus nuLiga übernommen"><span class="dot"></span>Ligadaten vom '+fmtDate(u)+(u.length>10?", "+u.slice(11,16)+" Uhr":"")+'</span>'+
    (artifactApi?'<button class="hbtn" data-act="toggleEdit">'+(editing?"Fertig":"Bearbeiten")+'</button>':'');
  var html=VIEWS[k]();
  if(dirty||saveMsg)html+='<div class="savebar"><span>'+(saveMsg||"Ungespeicherte Änderungen")+'</span>'+(dirty?'<button class="btn primary" data-act="save"'+(saving?" disabled":"")+'>'+(saving?"Speichert …":"Speichern")+'</button>':'')+'</div>';
  document.getElementById("main").innerHTML=html;
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});

document.addEventListener("click",function(e){
  var o=e.target.closest("[data-opp]");
  if(o){ui.opp=o.getAttribute("data-opp");if(location.hash!=="#gegner")location.hash="gegner";else render();e.preventDefault();return;}
  var s=e.target.closest("th[data-sort]");
  if(s){var k=s.getAttribute("data-sort");ui.teamSort=ui.teamSort.key===k?{key:k,dir:-ui.teamSort.dir}:{key:k,dir:k==="name"?1:-1};render();return;}
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");
  if(a==="toggleEdit"){editing=!editing;render();}
  else if(a==="planOwn"){ui.planAll=false;render();}
  else if(a==="planAll"){ui.planAll=true;render();}
  else if(a==="allOn"||a==="allOff"){document.querySelectorAll(".checks input").forEach(function(c){c.checked=a==="allOn";});}
  else if(a==="addTraining"){var d=document.getElementById("tDate").value,msg=document.getElementById("tMsg");
    if(!d){msg.textContent="Bitte ein Datum wählen.";return;}
    if(state.trainings.some(function(t){return t.date===d;})){msg.textContent="Für dieses Datum gibt es schon ein Training. Erst löschen, dann neu eintragen.";return;}
    var pr=[];document.querySelectorAll(".checks input:checked").forEach(function(c){pr.push(c.getAttribute("data-name"));});
    state.trainings.push({date:d,present:pr});change();}
  else if(a==="delTraining"){var dd=b.getAttribute("data-date");state.trainings=state.trainings.filter(function(t){return t.date!==dd;});change();}
  else if(a==="addPlayer"){var n=document.getElementById("newPlayer").value.trim();if(!n||players().some(function(p){return p.name===n;}))return;state.players.push(n);change();}
  else if(a==="delPlayer"){var nm=b.getAttribute("data-name");state.players=state.players.filter(function(x){return x!==nm;});delete state.manual[nm];change();}
  else if(a==="save")save();
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="oppSel"){ui.opp=t.value;render();return;}
  var v=t.value===""?null:Math.max(0,parseInt(t.value,10)||0);
  if(t.hasAttribute("data-pname")){var n=t.getAttribute("data-pname");state.manual[n]=state.manual[n]||{};state.manual[n][t.getAttribute("data-k")]=v;change(true);return;}
  if(t.hasAttribute("data-m")){var nr=t.getAttribute("data-m"),r=state.results[nr]||[null,null];r[+t.getAttribute("data-side")]=v;
    if(r[0]==null&&r[1]==null)delete state.results[nr];else state.results[nr]=r;change(true);}
});
function change(keepFocus){dirty=true;saveMsg="";var y=window.scrollY,f=keepFocus&&document.activeElement&&document.activeElement.id;render();window.scrollTo(0,y);if(f&&document.getElementById(f))document.getElementById(f).focus();}

/* ---------- Speichern: nur der Teamdaten-Block wird ersetzt ---------- */
var SOURCE=null;
try{if(false)fetch(location.href,{cache:"no-store"}).then(function(r){return r.ok?r.text():null;}).then(function(t){if(t&&t.indexOf('<script id="state"')>=0&&t.indexOf('<script id="league"')>=0)SOURCE=t;}).catch(function(){});}catch(e){}
function buildHtml(){
  var src=SOURCE||CAPTURED,open='<script id="state" type="application/json">',i=src.indexOf(open),j=src.indexOf("</"+"script>",i);
  if(i<0||j<0)throw new Error("Vorlage nicht gefunden");
  return src.slice(0,i+open.length)+JSON.stringify(state).replace(/</g,"\\u003c")+src.slice(j);
}
function save(){
  if(!artifactApi||saving)return;saving=true;render();
  var html;try{html=buildHtml();}catch(e){saving=false;saveMsg="Speichern nicht möglich: Seitenvorlage fehlt.";render();return;}
  artifactApi.publish(html).then(function(){dirty=false;saving=false;saveMsg="Gespeichert";render();setTimeout(function(){saveMsg="";render();},2500);})
  .catch(function(err){saving=false;var c=String((err&&(err.code||err.message))||err);
    saveMsg=/conflict/i.test(c)?"Die Seite wurde gerade aktualisiert. Bitte Änderung neu eintragen.":/not_granted|not_writer/i.test(c)?"Du hast kein Bearbeitungsrecht für diese Seite.":"Speichern hat nicht geklappt. Bitte nochmal versuchen.";render();});
}

render();

})();
</script>
</body>
</html>
